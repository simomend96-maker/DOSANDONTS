<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Come scrivere il profilo MioDottore per essere trovati dall'IA</title>

<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  /* BASE */
  --bg: #f7f2ed;
  --white: #ffffff;
  --ink: #242727;
  --ink-muted: #5f6363;
  --ink-faint: #8a8f8f;

  /* BRAND */
  --accent: #00a085;
  --accent-light: #e6f5f2;
  --accent-mid: #00856f;

  --danger: #f27d60;
  --danger-light: #fbe5e0;

  --highlight: #ffc859;
  --highlight-soft: #f4e0c1;

  --border: #e6ded8;

  --sans: 'Figtree', system-ui, sans-serif;
  --serif: 'Figtree', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.7;
}

/* HEADER */
header {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 2.5rem 2rem 2rem;
  max-width: 780px;
  margin: 0 auto;
}

.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--highlight-soft);
  border: 1px solid var(--highlight);
  padding: 4px 10px;
  border-radius: 20px;
  margin-bottom: 1rem;
}

h1 {
  font-family: var(--serif);
  font-size: clamp(1.8rem, 4vw, 2.6rem);
  font-weight: 600;
  line-height: 1.2;
  color: var(--ink);
  margin-bottom: 0.75rem;
}

.intro {
  font-size: 1rem;
  color: var(--ink-muted);
  max-width: 580px;
  margin-bottom: 1.5rem;
}

.why-box {
  background: var(--highlight-soft);
  border-left: 3px solid var(--accent);
  padding: 1rem 1.25rem;
  border-radius: 0 8px 8px 0;
  font-size: 0.875rem;
}

/* NAV */
.nav-wrap {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}

nav {
  max-width: 780px;
  margin: 0 auto;
  padding: 0 2rem;
  display: flex;
  overflow-x: auto;
}

.nav-link {
  padding: 1rem 1.1rem;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--ink-muted);
  text-decoration: none;
  border-bottom: 2px solid transparent;
}

.nav-link.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* MAIN */
main {
  max-width: 780px;
  margin: 0 auto;
  padding: 2rem;
}

section { display: none; }
section.active { display: block; }

/* RULES */
.rules-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

.rule-card {
  padding: 1.25rem;
  border-radius: 12px;
}

.rule-card.do {
  background: var(--accent-light);
}

.rule-card.dont {
  background: var(--danger-light);
}

.rule-card h3 {
  font-size: 0.9rem;
  font-weight: 600;
  margin-bottom: 0.4rem;
}

.rule-card p {
  font-size: 0.825rem;
  color: var(--ink-muted);
}

/* STEPS */
.step {
  padding: 1.5rem 0;
  border-bottom: 1px solid var(--border);
}

.step-num {
  font-weight: 600;
  margin-bottom: 0.5rem;
}

/* EXAMPLES */
.ex-btn.active-good {
  background: var(--accent);
  color: white;
}

.ex-btn.active-bad {
  background: var(--danger);
  color: white;
}

.hi-bad {
  background: rgba(242,125,96,0.2);
}

.hi-good {
  background: rgba(0,160,133,0.15);
}

/* CHECK */
.check-ico.ok {
  background: var(--accent-light);
  color: var(--accent);
}

.check-ico.ko {
  background: var(--danger-light);
  color: var(--danger);
}

/* CHIP */
.chip.pos {
  background: var(--accent-light);
  color: var(--accent);
}

.chip.neg {
  background: var(--danger-light);
  color: var(--danger);
}

/* FOOTER */
footer {
  max-width: 780px;
  margin: 0 auto;
  padding: 1.5rem;
  border-top: 1px solid var(--border);
  font-size: 0.75rem;
  color: var(--ink-faint);
}
</style>
</head>

<body>

</html>
